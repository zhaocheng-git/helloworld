<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Tlias智能学习辅助系统</title>
    <style>
        /* 第一部分：顶部导航栏 */
        .header {
            background-color: #d9d9d9;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .title {
            font-size: 24px;
            font-weight: bold;
            margin: 0;
        }
        .logout {
            font-size: 16px;
            color: #333;
            text-decoration: none;
        }
        .logout:hover {
            color: #ff0000;
            text-decoration: underline;
        }

        /* 第二部分：查询表单 —— 按钮组合在一起 + 铺满整行 */
        .search-form {
            margin: 25px 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        /* 表单项自动占满空间，美观均匀 */
        .search-form input,
        .search-form select {
            padding: 8px 12px;
            font-size: 14px;
            border: 1px solid #ccc;
            border-radius: 4px;
            flex: 1;
        }

        /* 按钮组：两个按钮贴在一起 */
        .btn-group {
            display: flex;
            gap: 0;
        }

        .search-form button {
            padding: 8px 20px;
            font-size: 14px;
            border: none;
            cursor: pointer;
        }

        /* 查询按钮（左边） */
        .btn-search {
            background-color: #409eff;
            color: white;
            border-radius: 4px 0 0 4px;
        }

        /* 清空按钮（右边） */
        .btn-clear {
            background-color: #6c757d;
            color: white;
            border-radius: 0 4px 4px 0;
        }

        .btn-search:hover { background-color: #337ecc; }
        .btn-clear:hover { background-color: #5a6268; }

        /* 第三部分：表格样式 */
        .table-container {
            margin: 20px;
            border: 1px solid #e4e7ed;
            border-radius: 6px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background: #fff;
        }
        th {
            background-color: #f5f7fa;
            padding: 12px 10px;
            /* 添加对齐 */
            text-align: center;
            font-weight: bold;
            color: #333;
        }
        td {        
            /* 添加填充 */
            padding: 12px 10px;
            text-align: center;
            /* 添加边框 */
            border-bottom: 1px solid #f0f2f5;
        }
        tbody tr:hover {
            background-color: #fafbfc;
        }
        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
        }
        .btn-edit {
            /* 添加内边距 */
            padding: 4px 10px;
            /* 添加背景色 */
            background: #67c23a; 
            /* 添加颜色 */
            color: white;
            /* 添加边框 */
            border: none;
                /* 添加圆角 */
            border-radius: 3px;
            /* 添加鼠标样式 */
            cursor: pointer;
            /* 添加间距 */
            margin-right: 6px; /* 添加间距 */
        }
        .btn-delete {
            padding: 4px 10px;
            background: #f56c6c;
            color: white;
            border: none;
            border-radius: 3px;
            cursor: pointer;
        }

        /* 第四部分：页脚版权区域 */
    .footer {
        /* 添加间距 */
        margin-top: 30px;
        background-color: #666666;
        color: #ffffff;
        /* 居中 */
        text-align: center;
        /* 填充内容 */
        padding: 16px 0;
    }
    .footer p {
        /* 段落间距 */
        margin: 6px 0;
        /* 字体大小 */
        font-size: 14px;
    }
    #container { 
        /* 居中显示 */
        margin: 0 auto;
        /* 占页面80% */
        width: 80%;
        
    }

    </style>
</head>
