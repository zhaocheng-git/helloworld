<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新思想引领</title>
</head>
<body>
    <!-- 定义一个标题 -->
     <h1>新思想引领</h1>

     <!-- 定义一个超链接，展示央视网 -->
      <!-- href属性，指定超链接的网址 
       target属性，指定超链接打开的方式
       blank 表示在新窗口打开
       _self表示在当前窗口打开(默认)
       -->
       <!-- 改为新窗口打开 -->
      <a href="http://www.cctv.com" target="_blank">央视网</a>
    

      
        
</body>
</html>
